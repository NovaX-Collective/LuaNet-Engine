name: Build all Android engines

on:
  workflow_dispatch:
    inputs:
      upload_artifacts:
        description: Upload compiled libraries for one day
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.abi }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        abi: [arm64-v8a, armeabi-v7a, x86_64]
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y ccache cmake ninja-build
      - name: Install Android NDK r29
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;29.0.14206865"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/29.0.14206865" >> "$GITHUB_ENV"
      - name: Validate catalog
        run: python3 scripts/validate-catalog.py
      - name: Build complete catalog
        env:
          ANDROID_ABIS: ${{ matrix.abi }}
          SKIP_EXISTING: "0"
          ENGINE_USE_CCACHE: "1"
        run: scripts/build-all.sh
      - name: Upload compiled engines
        if: ${{ inputs.upload_artifacts }}
        uses: actions/upload-artifact@v4
        with:
          name: luanet-engines-${{ matrix.abi }}
          path: build/artifacts/${{ matrix.abi }}/
          retention-days: 1
          compression-level: 9
